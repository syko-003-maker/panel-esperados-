version: '3.8'

services:
  # PostgreSQL Database (Production)
  postgres:
    image: postgres:16-alpine
    container_name: panel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # Named volume for data persistence across container restarts
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Only expose if needed for direct access (use ssh tunnel in prod)
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - panel-network

  # Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Ensure production build
        NODE_ENV: production
    container_name: panel-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Load from .env.production
      NODE_ENV: production
      # Database connection
      DATABASE_URL: ${DATABASE_URL}
      SHADOW_DATABASE_URL: ${SHADOW_DATABASE_URL}
      # NextAuth
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      # Discord Bot & OAuth
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID}
      NEXT_PUBLIC_DISCORD_GUILD_ID: ${NEXT_PUBLIC_DISCORD_GUILD_ID}
      # Discord Channels
      DISCORD_LOGS_CHANNEL_ID: ${DISCORD_LOGS_CHANNEL_ID}
      DISCORD_TICKET_PARENT_CHANNEL_ID: ${DISCORD_TICKET_PARENT_CHANNEL_ID}
      DISCORD_TICKET_HUB_CHANNEL_ID: ${DISCORD_TICKET_HUB_CHANNEL_ID}
      DISCORD_TICKET_CATEGORY_ID: ${DISCORD_TICKET_CATEGORY_ID}
      DISCORD_TICKETS_CHANNEL_ID: ${DISCORD_TICKETS_CHANNEL_ID}
      # Sanctions
      SANCTION_LOG_CHANNEL_ID: ${SANCTION_LOG_CHANNEL_ID}
      # Discord Roles
      LOS_ESPERADOS_ROLE_ID: ${LOS_ESPERADOS_ROLE_ID}
      CITIZEN_ROLE_ID: ${CITIZEN_ROLE_ID}
      ANCIEN_ESPERADOS_ROLE_ID: ${ANCIEN_ESPERADOS_ROLE_ID}
      OWNER_DISCORD_ID: ${OWNER_DISCORD_ID}
      CHEF_FAMILLE_ROLE_ID: ${CHEF_FAMILLE_ROLE_ID}
      STAFF_ROLE_ID: ${STAFF_ROLE_ID}
      AVERT_ORAL_PLAYTIME_ROLE_ID: ${AVERT_ORAL_PLAYTIME_ROLE_ID}
      AVERT_ORAL_REUNION_ROLE_ID: ${AVERT_ORAL_REUNION_ROLE_ID}
      AVERT_LEGER_ROLE_ID: ${AVERT_LEGER_ROLE_ID}
      AVERT_LOURD_ROLE_ID: ${AVERT_LOURD_ROLE_ID}
      DEMOTE_ROLE_ID: ${DEMOTE_ROLE_ID}
      RESERVISTE_ROLE_ID: ${RESERVISTE_ROLE_ID}
      BLACKLIST_ROLE_ID: ${BLACKLIST_ROLE_ID}
      # External APIs
      LYG_BASE_URL: ${LYG_BASE_URL}
      LYG_TOKEN: ${LYG_TOKEN}
      # Site Config
      SITE_BASE_URL: ${SITE_BASE_URL}
      DISCORD_API_BASE_URL: ${DISCORD_API_BASE_URL}
      # Security
      INGEST_SECRET: ${INGEST_SECRET}
      # Sanctions Engine
      ENABLE_AUTO_SANCTION_RULES: ${ENABLE_AUTO_SANCTION_RULES}
      # Observability (optional)
      SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN:-}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      # Debugging
      DEBUG_AUTH: ${DEBUG_AUTH}
    ports:
      # Next.js app listens on 3000
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - panel-network
    # Optional: mount for logs
    volumes:
      - app_logs:/app/.next

  # Discord Worker (Separate service)
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
      args:
        NODE_ENV: production
    container_name: panel-worker
    restart: unless-stopped
    depends_on:
      # Worker needs app healthy (uses its ports/config)
      app:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # Database connection
      DATABASE_URL: ${DATABASE_URL}
      SHADOW_DATABASE_URL: ${SHADOW_DATABASE_URL}
      # Discord Bot
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID}
      # Discord Channels
      DISCORD_LOGS_CHANNEL_ID: ${DISCORD_LOGS_CHANNEL_ID}
      SANCTION_LOG_CHANNEL_ID: ${SANCTION_LOG_CHANNEL_ID}
      # Discord Roles
      LOS_ESPERADOS_ROLE_ID: ${LOS_ESPERADOS_ROLE_ID}
      CITIZEN_ROLE_ID: ${CITIZEN_ROLE_ID}
      ANCIEN_ESPERADOS_ROLE_ID: ${ANCIEN_ESPERADOS_ROLE_ID}
      AVERT_ORAL_PLAYTIME_ROLE_ID: ${AVERT_ORAL_PLAYTIME_ROLE_ID}
      AVERT_ORAL_REUNION_ROLE_ID: ${AVERT_ORAL_REUNION_ROLE_ID}
      AVERT_LEGER_ROLE_ID: ${AVERT_LEGER_ROLE_ID}
      AVERT_LOURD_ROLE_ID: ${AVERT_LOURD_ROLE_ID}
      DEMOTE_ROLE_ID: ${DEMOTE_ROLE_ID}
      RESERVISTE_ROLE_ID: ${RESERVISTE_ROLE_ID}
      BLACKLIST_ROLE_ID: ${BLACKLIST_ROLE_ID}
      # Sanctions
      ENABLE_AUTO_SANCTION_RULES: ${ENABLE_AUTO_SANCTION_RULES}
      # Observability
      SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN:-}
      # Debugging
      DEBUG_AUTH: ${DEBUG_AUTH}
    networks:
      - panel-network
    # No public ports for worker (internal only)
    # Optional: mount for logs
    volumes:
      - worker_logs:/app/.next

volumes:
  # PostgreSQL data persistence
  postgres_data:
    driver: local
  # Application logs
  app_logs:
    driver: local
  # Worker logs
  worker_logs:
    driver: local

networks:
  panel-network:
    driver: bridge
